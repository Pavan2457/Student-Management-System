<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="studentForm">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="rollNo">Roll Number</label>
            <input
                type="text"
                id="rollNo"
                placeholder="Enter your roll number"
                required
            >

            <label for="cgpa">CGPA</label>
            <input
            type="number"
            id="cgpa"
            placeholder="Enter CGPA"
            min="0"
            max="9.99"
            step="0.01"
            require
            >

            <label for="course">Course</label>
            <input
                type="text"
                id="course"
                placeholder="Example: B.Tech"
                required
            >

            <label for="branch">Branch</label>
            <select id="branch" required>
                <option value="">Select Branch</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                <option value="IT">IT</option>
            </select>

            <label for="year">Year</label>
            <select id="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <button type="submit" id="submitButton">Register</button>
            <button type="button" id="cancelButton" style="display:none;">Cancel</button>

        </form>

        <p id="message"></p>

        <h2>Students</h2>

        <div id="studentList"></div>

    </div>


    <script>

const form = document.getElementById("studentForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const cancelButton = document.getElementById("cancelButton");

let updateId = null;


// CREATE / UPDATE
form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const student = {
        name: document.getElementById("name").value,
        rollNo: document.getElementById("rollNo").value,
        course: document.getElementById("course").value,
        branch: document.getElementById("branch").value,
        year: Number(document.getElementById("year").value),
        cgpa: Number(document.getElementById("cgpa").value)
    };


    try {

        let response;


        // UPDATE
        if (updateId) {

            response = await fetch("/students/" + updateId, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            });

        }

        // CREATE
        else {

            response = await fetch("/students", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            });

        }


        const data = await response.json();


        if (response.ok) {

            if (updateId) {

                message.textContent = "Student updated successfully!";

            } else {

                message.textContent = "Registration successful!";

            }

            message.style.color = "green";

            form.reset();

            updateId = null;

            submitButton.textContent = "Register";

            cancelButton.style.display = "none";

            loadStudents();

        } else {

            message.textContent = data.error;
            message.style.color = "red";

        }

    } catch (error) {

        message.textContent = "Unable to connect to server.";
        message.style.color = "red";

    }

});


// READ
async function loadStudents() {

    const response = await fetch("/students");

    const students = await response.json();

    const list = document.getElementById("studentList");

    list.innerHTML = "";


    students.forEach(student => {

        list.innerHTML += `

            <div class="student">

                <p>
                    <strong>${student.name}</strong><br>
                    Roll No: ${student.rollNo}<br>
                    Course: ${student.course}<br>
                    Branch: ${student.branch}<br>
                    Year: ${student.year}<br>
                    CGPA: ${student.cgpa}<br>
                </p>

                <button type="button"
                    onclick="updateStudent('${student._id}')">
                    Update
                </button>

                <button type="button"
                    onclick="deleteStudent('${student._id}')">
                    Delete
                </button>

                <hr>

            </div>

        `;

    });

}


// UPDATE
async function updateStudent(id) {

    const response = await fetch("/students");

    const students = await response.json();

    const student = students.find(s => s._id === id);


    if (!student) {
        return;
    }


    // Put existing data into the form

    document.getElementById("name").value = student.name;

    document.getElementById("rollNo").value = student.rollNo;

    document.getElementById("course").value = student.course;

    document.getElementById("branch").value = student.branch;

    document.getElementById("year").value = student.year;

    document.getElementById("cgpa").value = student.cgpa;


    // Remember which student we are editing

    updateId = id;


    // Change button

    submitButton.textContent = "Update";

    cancelButton.style.display = "inline-block";


    message.textContent = "Edit the details and click Update.";
    message.style.color = "blue";

}


// CANCEL UPDATE
cancelButton.addEventListener("click", () => {

    form.reset();

    updateId = null;

    submitButton.textContent = "Register";

    cancelButton.style.display = "none";

    message.textContent = "";

});


// DELETE
async function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }


    try {

        const response = await fetch("/students/" + id, {

            method: "DELETE"

        });


        const data = await response.json();


        if (response.ok) {

            message.textContent = "Student deleted successfully!";
            message.style.color = "green";

            loadStudents();

        } else {

            message.textContent = data.error;
            message.style.color = "red";

        }

    } catch (error) {

        message.textContent = "Unable to delete student.";
        message.style.color = "red";

    }
};


// Load students when page opens
loadStudents();

</script>

</body>
</html>
